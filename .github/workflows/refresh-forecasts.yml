name: Refresh forecasts

# During the Kharif season, re-download weather and cyclone tracks a few days after each month
# ends, re-run the backtests and forecasts, commit the regenerated data and republish the image.
on:
  schedule:
    - cron: "0 3 5 7-12 *" # 03:00 UTC on the 5th, July-December
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-forecasts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pipeline all --refresh-weather
      - id: commit
        name: Commit regenerated data
        run: |
          if git diff --quiet -- data/processed; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git commit -m "data: refresh forecasts ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
