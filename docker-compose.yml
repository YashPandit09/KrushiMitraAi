# One command to run KrushiMitra AI locally:  docker compose up --build
# Then open http://localhost:8000
services:
  app:
    build: .
    image: krushimitra-ai:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env # optional; copy .env.example to .env to enable mandi prices
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
